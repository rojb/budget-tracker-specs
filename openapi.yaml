  /plans/{planId}/transfers:
    get:
      tags: [Accounts]
      operationId: listTransfers
      summary: List transfers between accounts
      description: Newest first by `createdAt` (ties by id); with `accountId`, only transfers that leave or enter that account.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: accountId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of transfers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Accounts]
      operationId: createTransfer
      summary: Move money between two accounts (owner or editor)
      description: No envelope and no payee; only the two balances change (FR-28).
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: The transfer was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: One of the accounts is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                message: Account is archived
                error: Conflict
  /plans/{planId}/transfers/{transferId}:
    delete:
      tags: [Accounts]
      operationId: deleteTransfer
      summary: Delete a transfer (owner or editor)
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/TransferId'
      responses:
        '204':
          description: The transfer was deleted and both balances restored.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions (movements)
      description: |
        Newest first by registration instant, `createdAt` (ties by id): the transaction recorded last
        comes first, whatever `occurredAt` it carries. `occurredAt` still decides the month, the
        balances and the date and time filters. Transactions that were deleted are not listed. Every filter is optional and they combine with AND. Dates and times are local to
        the plan's time zone. `summary` totals every matching transaction (not only the page) with
        its whole amount. Transfers between accounts are not transactions and are not listed here.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: accountId
          in: query
          description: Only the transactions recorded on this account.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: payeeId
          in: query
          description: Only the transactions of this payee.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: envelopeId
          in: query
          description: Only the transactions with at least one portion on this envelope.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/TransactionDirection'
        - name: from
          in: query
          description: First local date included (`YYYY-MM-DD`). Must not be after `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last local date included (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
        - name: timeFrom
          in: query
          description: |
            Start of the local time-of-day range, inclusive to the minute (`HH:mm`), on any date. When
            it is after `timeTo` the range crosses midnight.
          schema:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
            examples: ['18:00']
        - name: timeTo
          in: query
          description: End of the local time-of-day range, inclusive to the minute (`HH:mm`).
          schema:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
            examples: ['23:59']
        - name: q
          in: query
          description: |
            Text search, without letter case, over the payee name, the description and the name of
            the envelope of any portion.
          schema:
            type: string
            minLength: 1
            maxLength: 60
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Record an expense or an income (owner or editor)
      description: |
        An expense names its envelope with `envelopeId` or is divided with `splits` (at least two
        portions that add up exactly to `amountMinor`). An income may name an `envelopeId`; without
        one it goes to Ready to Assign. The payee is optional: `payeeId` of an active payee or
        `payeeName`, which reuses the active payee with that name or creates it.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: The transaction was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The account is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                message: Account is archived
                error: Conflict
  /plans/{planId}/transactions/{transactionId}:
    put:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Edit a transaction (owner or editor)
      description: |
        Replaces every editable field and the portions with the body, which has the same shape and
        rules as recording one. Sending the previous state back undoes an edit exactly: `id` and
        `createdAt` never change. The account is validated only when it differs from the current one
        (`409` if archived) and so is `payeeId` (`404` if deleted). The response lists the months
        whose figures were recalculated.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '200':
          description: The edited transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionChange'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The new account is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                message: Account is archived
                error: Conflict
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Delete a transaction logically (owner or editor)
      description: |
        The transaction stops counting everywhere (list, summary, balances, activity, payee counts)
        but is kept, so `restoreTransaction` brings it back exactly. Deleting one that is already
        deleted is `404`.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The transaction was deleted; the months whose figures were recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffectedMonths'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/transactions/{transactionId}/restore:
    post:
      tags: [Transactions]
      operationId: restoreTransaction
      summary: Restore a deleted transaction (owner or editor)
      description: |
        Gives back the transaction with the same id, creation instant, amount, account, payee, date,
        description and portions it had when it was deleted. Restoring one that is not deleted is
        `404`.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: The restored transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionChange'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/months/{month}:
    get:
      tags: [Months]
      operationId: getMonthSummary
      summary: Get the figures of a budget month
      description: |
        The figures the budget engine derives for the month: Σ account balances, Σ Available, the
        amount reserved for later months and the Ready to Assign (for a future month, the current
        month's), plus the total assigned in the month and how many envelopes are in each state.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/MonthPath'
      responses:
        '200':
          description: The figures of the month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthSummary'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/months/{month}/assignments:
    post:
      tags: [Months]
      operationId: assignToEnvelope
      summary: Add money to an envelope's assignment of a month (owner or editor)
      description: |
        Adds the amount to the envelope's assignment of the month (any month: past, current or
        future); a negative amount takes money back. Assigning more than the Ready to Assign is
        allowed and leaves it negative.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/MonthPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignMoneyRequest'
      responses:
        '200':
          description: The month, its Ready to Assign and the updated line of the envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignMoneyResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/months/{month}/close:
    get:
      tags: [Months]
      operationId: getMonthClose
      summary: Get the close of a month into the next one
      description: |
        What carries into the next month (positive Available), what is deducted from its Ready to
        Assign (overspending), the next month's balance, Available and reserved figures, and
        whether the close was already confirmed.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/MonthPath'
      responses:
        '200':
          description: The close of the month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthClose'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Months]
      operationId: confirmMonthClose
      summary: Confirm the close of an ended month (owner or editor)
      description: |
        Records that the close of the month was seen; no figure changes. Confirming again changes
        nothing. Only a month before the current one can be confirmed (`409`).
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/MonthPath'
      responses:
        '200':
          description: The close of the month, confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthClose'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MonthNotEnded'
  /plans/{planId}/reports/spending:
    get:
      tags: [Reports]
      operationId: getSpendingReport
      summary: Spending by envelope per month
      description: |
        For each month of the range, the money spent from each envelope (expense portions minus
        income sent to it, in the plan's time zone), envelopes with spending above zero only,
        largest first, and the month total.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: One entry per month of the range, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingReport'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/reports/income-expense:
    get:
      tags: [Reports]
      operationId: getIncomeExpenseReport
      summary: Income and expenses per month
      description: |
        For each month of the range, the sum of the income and of the expense transactions of the
        plan. Transfers between accounts count as neither.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: One entry per month of the range, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeExpenseReport'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/reports/net-worth:
    get:
      tags: [Reports]
      operationId: getNetWorthReport
      summary: Net worth at the end of each month
      description: |
        For each month of the range, the sum of the balances of the active accounts at the end of
        the month.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: One entry per month of the range, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetWorthReport'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvitationCode:
      name: code
      in: path
      required: true
      description: Invitation code, with or without the dash, any letter case.
      schema:
        type: string
        pattern: '^[A-Za-z0-9]{3}-?[A-Za-z0-9]{3}$'
        examples: [K7M-4QX]
    PayeeId:
      name: payeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EnvelopeId:
      name: envelopeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      description: Id of a suggested goal photo (`vacaciones`, `auto`, `emergencia` or `mudanza`).
      schema:
        type: string
        examples: [vacaciones]
    Month:
      name: month
      in: query
      description: Budget month as YYYY-MM; the current month in the plan's time zone when absent.
      schema:
        $ref: '#/components/schemas/MonthKey'
    MonthPath:
      name: month
      in: path
      required: true
      description: Budget month as YYYY-MM.
      schema:
        $ref: '#/components/schemas/MonthKey'
    ReportFrom:
      name: from
      in: query
      description: First month of the range; five months before `to` when absent. At most 24 months.
      schema:
        $ref: '#/components/schemas/MonthKey'
    ReportTo:
      name: to
      in: query
      description: Last month of the range; the current month in the plan's time zone when absent.
      schema:
        $ref: '#/components/schemas/MonthKey'
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 401
            message: Unauthorized
            error: Unauthorized
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            message: Resource not found
            error: Not Found
    Forbidden:
      description: The caller's role in the plan does not allow this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 403
            message: Your role in this plan does not allow this action
            error: Forbidden
    Conflict:
      description: The resource is already in the requested state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Account is already archived
            error: Conflict
    OwnerMembership:
      description: The plan owner's membership cannot be changed or removed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: The owner's membership cannot be changed
            error: Conflict
    PayeeNameTaken:
      description: Another active payee of the plan already has that name (case-insensitive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Payee name already in use
            error: Conflict
    EnvelopeGroupNameTaken:
      description: Another group of the plan already has that name (case-insensitive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Envelope group name already in use
            error: Conflict
    EnvelopeNameTaken:
      description: Another envelope of the plan already has that name (case-insensitive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Envelope name already in use
            error: Conflict
    PlanHasEnvelopes:
      description: The template can only be applied to a plan that has no envelopes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: The plan already has envelopes
            error: Conflict
    MonthNotEnded:
      description: The month has not ended yet, so its close cannot be confirmed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: The month has not ended yet
            error: Conflict
    MoveExceedsAvailable:
      description: The amount is greater than the source envelope's Available in the month; nothing was moved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: The source envelope has less available than the amount
            error: Conflict
    PayloadTooLarge:
      description: The uploaded file is larger than 5 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 413
            message: File too large
            error: Payload Too Large
    UnsupportedMediaType:
      description: The file is not a JPEG, PNG or WebP image (decided by its content) or cannot be decoded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 415
            message: The photo must be a JPEG, PNG or WebP image
            error: Unsupported Media Type
    ValidationFailed:
      description: The request failed validation; `message` lists one entry per violated constraint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            statusCode: 400
            message:
              - amountMinor must be an integer number
            error: Bad Request
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          description: Equal to the HTTP status.
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          description: Short HTTP reason phrase.
    ValidationError:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          enum: [400]
        message:
          type: array
          items:
            type: string
        error:
          type: string
          enum: [Bad Request]
    RegisterRequest:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: [Sofía Martínez]
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored lowercase; unique across accounts.
          examples: [sofia@correo.com]
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [sofia@correo.com]
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
    User:
      type: object
      description: A person with an account. Never carries credentials.
      required: [id, name, email, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AuthSession:
      type: object
      description: A signed JWT access token (default expiry 7 days, no refresh token) and its user.
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: 'Sent as `Authorization: Bearer <accessToken>`.'
        user:
          $ref: '#/components/schemas/User'
    PlanRole:
      type: string
      description: |
        Role of a member in a plan. `owner` manages the plan (rename, delete, and in later changes
        invitations); `editor` changes the plan's data; `viewer` only reads.
      enum: [owner, editor, viewer]
    PlanMember:
      type: object
      required: [userId, name, email, role, joinedAt]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/PlanRole'
        joinedAt:
          $ref: '#/components/schemas/Timestamp'
    Plan:
      type: object
      description: A budget plan. Never carries amounts.
      required: [id, name, currency, timeZone, myRole, members, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Mi plan]
        currency:
          $ref: '#/components/schemas/Currency'
        timeZone:
          type: string
          description: IANA time zone used to attribute transactions to budget months.
          examples: [America/Argentina/Buenos_Aires]
        myRole:
          $ref: '#/components/schemas/PlanRole'
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlanMember'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CreatePlanRequest:
      type: object
      required: [name, currencyCode]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Mi plan]
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          maxLength: 64
          description: IANA time zone; defaults to America/Argentina/Buenos_Aires.
        firstAccount:
          $ref: '#/components/schemas/CreateAccountRequest'
    UpdatePlanRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    AccountType:
      type: string
      description: 'Kind of account: bank (Banco), digitalWallet (Billetera virtual), cash (Efectivo).'
      enum: [bank, digitalWallet, cash]
    Account:
      type: object
      description: An account of a plan. `balanceMinor` is derived on every read, never stored.
      required: [id, name, type, openingBalanceMinor, balanceMinor, archived, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Banco Nación]
        type:
          $ref: '#/components/schemas/AccountType'
        openingBalanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
        balanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
        archived:
          type: boolean
        archivedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the account was archived; present only while `archived` is true.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AccountDetail:
      description: An account plus the money that entered and left it in one month.
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          required: [month, inflowMinor, outflowMinor]
          properties:
            month:
              $ref: '#/components/schemas/MonthKey'
            inflowMinor:
              $ref: '#/components/schemas/MoneyMinor'
            outflowMinor:
              $ref: '#/components/schemas/MoneyMinor'
    CreateAccountRequest:
      type: object
      required: [name, type, openingBalanceMinor]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Mercado Pago]
        type:
          $ref: '#/components/schemas/AccountType'
        openingBalanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        type:
          $ref: '#/components/schemas/AccountType'
        openingBalanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
    Payee:
      type: object
      description: A payee of a plan. A deleted payee is still readable so past transactions can show it.
      required: [id, name, transactionCount, deleted, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Coto]
        suggestedEnvelopeId:
          $ref: '#/components/schemas/Uuid'
          description: Envelope proposed when this payee is chosen; absent when there is none.
        transactionCount:
          type: integer
          minimum: 0
          description: Transactions that reference this payee.
        deleted:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PayeePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Payee'
    CreatePayeeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Coto]
        suggestedEnvelopeId:
          $ref: '#/components/schemas/Uuid'
    UpdatePayeeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        suggestedEnvelopeId:
          $ref: '#/components/schemas/Uuid'
    InvitationRole:
      type: string
      description: Role an invitation grants, or a member can be given (the owner role is not transferable).
      enum: [editor, viewer]
    Invitation:
      type: object
      required: [code, role, expiresAt, createdAt, link]
      properties:
        code:
          type: string
          description: Shown as XXX-XXX.
          examples: [K7M-4QX]
        role:
          $ref: '#/components/schemas/InvitationRole'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        link:
          type: string
          format: uri
          description: Link encoded in the QR; opens the join screen with the code loaded.
          examples: ['https://sobres.app/unirse/K7M4QX']
    CreateInvitationRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/InvitationRole'
    InvitationPreview:
      type: object
      description: What a code gives access to. Never carries amounts or member emails.
      required: [planName, ownerName, currency, role, expiresAt]
      properties:
        planName:
          type: string
          examples: [Casa con Juli]
        ownerName:
          type: string
          examples: [Sofía Martínez]
        currency:
          $ref: '#/components/schemas/Currency'
        role:
          $ref: '#/components/schemas/InvitationRole'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    UpdateMemberRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/InvitationRole'
    Transfer:
      type: object
      description: Money moved between two accounts of the same plan. Never touches envelopes.
      required: [id, fromAccountId, toAccountId, amountMinor, occurredAt, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        fromAccountId:
          $ref: '#/components/schemas/Uuid'
        toAccountId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 1
          description: Positive amount in the plan currency's minor units.
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    TransferPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Transfer'
    CreateTransferRequest:
      type: object
      required: [fromAccountId, toAccountId, amountMinor, occurredAt]
      additionalProperties: false
      properties:
        fromAccountId:
          $ref: '#/components/schemas/Uuid'
        toAccountId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 1
          examples: [20000]
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
    EnvelopeIcon:
      type: string
      description: Closed set of icon names an envelope can carry; the client maps each to a glyph.
      enum: [tag, home, bus, utensils, heartPulse, gift, cart, pill, wifi, settings, ticket, repeat, lifeBuoy, plane]
    EnvelopeGroup:
      type: object
      description: An ordered group of envelopes of a plan.
      required: [id, name, position, envelopeCount, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Día a día]
        position:
          type: integer
          minimum: 0
          description: Zero-based place of the group in the plan.
        envelopeCount:
          type: integer
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CreateEnvelopeGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Hogar]
    UpdateEnvelopeGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    ReorderEnvelopeGroupsRequest:
      type: object
      required: [groupIds]
      additionalProperties: false
      properties:
        groupIds:
          type: array
          description: Every group of the plan exactly once, in the desired order.
          items:
            $ref: '#/components/schemas/Uuid'
    Envelope:
      type: object
      description: An envelope of a plan. `groupId` is absent when it has no group ("Sin grupo").
      required: [id, name, icon, position, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Supermercado]
        icon:
          $ref: '#/components/schemas/EnvelopeIcon'
        groupId:
          $ref: '#/components/schemas/Uuid'
        position:
          type: integer
          minimum: 0
          description: Zero-based place inside its group (or among the envelopes without a group).
        goal:
          $ref: '#/components/schemas/EnvelopeGoal'
        photoUrl:
          type: string
          description: Path, relative to the API, of the envelope's photo (served only to members with a bearer token). It carries a `v` version query, so a changed photo is a new URL. Absent when the envelope has no photo.
          examples: ['/plans/0d9c1d7e-6a0c-4a77-9d0e-6d1f2a3b4c5d/envelopes/7f1f6a64-3a60-4d5c-9a43-0a5c8c1f2b11/photo?v=1790000000000']
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    EnvelopeGoalType:
      type: string
      description: '`monthly` is an amount to assign every month; `targetByDate` is an amount to have available by a due date.'
      enum: [monthly, targetByDate]
    EnvelopeGoal:
      type: object
      description: |
        The goal of an envelope. A `monthly` goal takes no `dueDate`; a `targetByDate` goal requires
        one (a date in the current month or later, in the plan's time zone).
      required: [type, targetMinor]
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/EnvelopeGoalType'
        targetMinor:
          type: integer
          minimum: 1
          examples: [180000]
        dueDate:
          type: string
          format: date
          examples: ['2026-12-15']
    EnvelopeState:
      type: string
      description: |
        Derived state of an envelope in a month, computed only by the API: `overspent` when its
        Available is negative; otherwise `underfunded` when it has a goal and the amount assigned in
        the month is lower than the required amount; otherwise `funded`.
      enum: [funded, underfunded, overspent]
    GoalStatus:
      type: object
      description: Progress of an envelope's goal in a month, derived from the goal and the budget engine's figures.
      required: [requiredMinor, missingMinor, savedMinor, remainingMinor, percent]
      properties:
        requiredMinor:
          type: integer
          minimum: 0
          description: Amount to assign in the month to be on track (the target for a monthly goal; the shortfall over the carryover spread over the months left, rounded up, for a goal with a date).
        missingMinor:
          type: integer
          minimum: 0
          description: What the month still needs, `max(0, required - assigned)`.
        savedMinor:
          type: integer
          minimum: 0
          description: Assigned of the month for a monthly goal; Available (floored at 0) for a goal with a date.
        remainingMinor:
          type: integer
          minimum: 0
          description: '`max(0, target - saved)`.'
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Saved over target, floored and capped at 100.
        monthsRemaining:
          type: integer
          minimum: 0
          description: Months from the viewed month to the due month; only for a goal with a date, 0 in the due month and after it.
    EnvelopeLine:
      type: object
      description: An envelope with the figures the budget engine derives for a month, its state and, with a goal, the goal status.
      required: [envelope, assignedMinor, spentMinor, availableMinor, state]
      properties:
        envelope:
          $ref: '#/components/schemas/Envelope'
        assignedMinor:
          $ref: '#/components/schemas/MoneyMinor'
        spentMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Net outflow of the month (expenses minus income sent to the envelope); negative when income exceeds expenses.
        availableMinor:
          $ref: '#/components/schemas/MoneyMinor'
        state:
          $ref: '#/components/schemas/EnvelopeState'
        goalStatus:
          $ref: '#/components/schemas/GoalStatus'
    EnvelopeDetail:
      type: object
      description: One envelope with the figures and the activity of a month.
      required: [month, line, carryoverMinor, activity, activityTotal]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        line:
          $ref: '#/components/schemas/EnvelopeLine'
        carryoverMinor:
          $ref: '#/components/schemas/MoneyMinor'
        activity:
          type: array
          description: Transactions of the month with a portion on the envelope, newest first by `createdAt` (ties by id), at most 100.
          items:
            $ref: '#/components/schemas/Transaction'
        activityTotal:
          type: integer
          minimum: 0
          description: Number of transactions of the month with a portion on the envelope.
    MoveMoneyRequest:
      type: object
      required: [fromEnvelopeId, toEnvelopeId, amountMinor]
      additionalProperties: false
      properties:
        fromEnvelopeId:
          $ref: '#/components/schemas/Uuid'
        toEnvelopeId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 1
          examples: [6200]
        month:
          $ref: '#/components/schemas/MonthKey'
    MoveMoneyResult:
      type: object
      required: [month, readyToAssignMinor, from, to]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        readyToAssignMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Ready to Assign of the month; a move never changes it.
        from:
          $ref: '#/components/schemas/EnvelopeLine'
        to:
          $ref: '#/components/schemas/EnvelopeLine'
    MonthSummary:
      type: object
      description: The figures the budget engine derives for one month.
      required: [month, currentMonth, isFuture, balanceMinor, availableMinor, futureAssignedMinor, readyToAssignMinor, assignedMinor, envelopeCount, overspentCount, underfundedCount, fundedCount]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        currentMonth:
          $ref: '#/components/schemas/MonthKey'
          description: Current month in the plan's time zone.
        isFuture:
          type: boolean
          description: True when the month is after the current month.
        balanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Σ balances of the active accounts at the end of the month.
        availableMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Σ Available of every envelope in the month.
        futureAssignedMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Σ Assigned in the months after this one.
        readyToAssignMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Ready to Assign of the month; for a future month, the current month's.
        assignedMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Σ Assigned in the month.
        envelopeCount:
          type: integer
          minimum: 0
        overspentCount:
          type: integer
          minimum: 0
        underfundedCount:
          type: integer
          minimum: 0
        fundedCount:
          type: integer
          minimum: 0
    AssignMoneyRequest:
      type: object
      required: [envelopeId, amountMinor]
      additionalProperties: false
      properties:
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          description: Amount added to the envelope's assignment of the month; negative takes money back, never 0.
          examples: [6200]
    AssignMoneyResult:
      type: object
      required: [month, readyToAssignMinor, line]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        readyToAssignMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Ready to Assign of the month after the assignment; negative when over-assigned.
        line:
          $ref: '#/components/schemas/EnvelopeLine'
    CloseLine:
      type: object
      required: [envelopeId, name, amountMinor]
      properties:
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        amountMinor:
          type: integer
          minimum: 1
          description: Amount carried, or deducted (positive), in minor units.
    MonthClose:
      type: object
      description: The close of a month into the next one (FR-12).
      required: [fromMonth, toMonth, carried, deducted, totalDeductedMinor, readyToAssignFromMinor, readyToAssignToMinor, balanceMinor, availableMinor, futureAssignedMinor, confirmed]
      properties:
        fromMonth:
          $ref: '#/components/schemas/MonthKey'
        toMonth:
          $ref: '#/components/schemas/MonthKey'
        carried:
          type: array
          description: Envelopes whose positive Available carries into the next month.
          items:
            $ref: '#/components/schemas/CloseLine'
        deducted:
          type: array
          description: Overspent envelopes, deducted from the next month's Ready to Assign; they restart at 0.
          items:
            $ref: '#/components/schemas/CloseLine'
        totalDeductedMinor:
          $ref: '#/components/schemas/MoneyMinor'
        readyToAssignFromMinor:
          $ref: '#/components/schemas/MoneyMinor'
        readyToAssignToMinor:
          $ref: '#/components/schemas/MoneyMinor'
        balanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Σ account balances at the end of the next month.
        availableMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Σ Available of the next month.
        futureAssignedMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Σ Assigned after the next month; balance − available − this = readyToAssignTo.
        confirmed:
          type: boolean
          description: True once an owner or editor confirmed the close.
    EnvelopeSpending:
      type: object
      required: [envelopeId, name, icon, amountMinor]
      properties:
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        icon:
          $ref: '#/components/schemas/EnvelopeIcon'
        amountMinor:
          type: integer
          minimum: 1
    SpendingMonth:
      type: object
      required: [month, totalMinor, envelopes]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        totalMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Σ of the envelopes' spending in the month.
        envelopes:
          type: array
          description: Envelopes with spending above zero, largest first.
          items:
            $ref: '#/components/schemas/EnvelopeSpending'
    SpendingReport:
      type: object
      required: [from, to, months]
      properties:
        from:
          $ref: '#/components/schemas/MonthKey'
        to:
          $ref: '#/components/schemas/MonthKey'
        months:
          type: array
          items:
            $ref: '#/components/schemas/SpendingMonth'
    IncomeExpenseMonth:
      type: object
      required: [month, incomeMinor, expenseMinor]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        incomeMinor:
          $ref: '#/components/schemas/MoneyMinor'
        expenseMinor:
          $ref: '#/components/schemas/MoneyMinor'
    IncomeExpenseReport:
      type: object
      required: [from, to, months]
      properties:
        from:
          $ref: '#/components/schemas/MonthKey'
        to:
          $ref: '#/components/schemas/MonthKey'
        months:
          type: array
          items:
            $ref: '#/components/schemas/IncomeExpenseMonth'
    NetWorthMonth:
      type: object
      required: [month, balanceMinor]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        balanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Σ balances of the active accounts at the end of the month.
    NetWorthReport:
      type: object
      required: [from, to, months]
      properties:
        from:
          $ref: '#/components/schemas/MonthKey'
        to:
          $ref: '#/components/schemas/MonthKey'
        months:
          type: array
          items:
            $ref: '#/components/schemas/NetWorthMonth'
    PhotoSuggestionId:
      type: string
      enum: [vacaciones, auto, emergencia, mudanza]
    PhotoSuggestion:
      type: object
      required: [id, name, imageUrl]
      properties:
        id:
          $ref: '#/components/schemas/PhotoSuggestionId'
        name:
          type: string
          examples: [Vacaciones]
        imageUrl:
          type: string
          description: Path, relative to the API, of the suggestion's image.
          examples: ['/envelope-photo-suggestions/vacaciones/image']
    SuggestedPhotoRequest:
      type: object
      required: [suggestionId]
      additionalProperties: false
      properties:
        suggestionId:
          $ref: '#/components/schemas/PhotoSuggestionId'
    EnvelopeList:
      type: object
      required: [month, readyToAssignMinor, items]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        readyToAssignMinor:
          $ref: '#/components/schemas/MoneyMinor'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeLine'
    CreateEnvelopeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Suscripciones]
        groupId:
          $ref: '#/components/schemas/Uuid'
        icon:
          $ref: '#/components/schemas/EnvelopeIcon'
        goal:
          $ref: '#/components/schemas/EnvelopeGoal'
    UpdateEnvelopeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        groupId:
          $ref: '#/components/schemas/Uuid'
        icon:
          $ref: '#/components/schemas/EnvelopeIcon'
    ReorderEnvelopesRequest:
      type: object
      required: [envelopeIds]
      additionalProperties: false
      properties:
        groupId:
          $ref: '#/components/schemas/Uuid'
          description: The group whose envelopes are ordered; absent for the envelopes without a group.
        envelopeIds:
          type: array
          description: Every envelope of that scope exactly once, in the desired order.
          items:
            $ref: '#/components/schemas/Uuid'
    TemplateEnvelope:
      type: object
      required: [name, icon]
      properties:
        name:
          type: string
          examples: [Alquiler]
        icon:
          $ref: '#/components/schemas/EnvelopeIcon'
    TemplateGroup:
      type: object
      required: [name, envelopes]
      properties:
        name:
          type: string
          examples: [Obligaciones]
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/TemplateEnvelope'
    EnvelopeTemplate:
      type: object
      description: The suggested starter template, the same for every plan (4 groups, 12 envelopes).
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TemplateGroup'
    ApplyEnvelopeTemplateRequest:
      type: object
      additionalProperties: false
      properties:
        envelopeNames:
          type: array
          description: Names of the template envelopes to create; all of them when absent.
          items:
            type: string
    EnvelopeTemplateResult:
      type: object
      required: [groups, envelopes]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeGroup'
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/Envelope'
    InitialAssignment:
      type: object
      required: [envelopeId, amountMinor]
      additionalProperties: false
      properties:
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 0
          examples: [280000]
    InitialAssignmentRequest:
      type: object
      required: [assignments]
      additionalProperties: false
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        assignments:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/InitialAssignment'
    InitialAssignmentResult:
      type: object
      required: [month, assignedMinor, readyToAssignMinor]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        assignedMinor:
          $ref: '#/components/schemas/MoneyMinor'
        readyToAssignMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Ready to Assign of the month after the assignment; negative when over-assigned.
    TransactionDirection:
      type: string
      description: '`expense` moves money out of the account, `income` moves money in.'
      enum: [expense, income]
    TransactionSplit:
      type: object
      description: |
        One portion of a transaction. `envelopeId` is absent for an income sent to Ready to Assign
        and for a portion whose envelope was deleted ("Sin sobre").
      required: [amountMinor]
      properties:
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        envelopeName:
          type: string
          examples: [Supermercado]
        amountMinor:
          type: integer
          minimum: 1
    Transaction:
      type: object
      description: An expense or income of a plan. Its portions always add up to `amountMinor`.
      required: [id, direction, accountId, accountName, amountMinor, occurredAt, splits, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        accountId:
          $ref: '#/components/schemas/Uuid'
        accountName:
          type: string
          examples: [Banco Nación]
        amountMinor:
          type: integer
          minimum: 1
          description: Positive amount in the plan currency's minor units.
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        payeeId:
          $ref: '#/components/schemas/Uuid'
        payeeName:
          type: string
          description: Name of the payee, also when it was deleted afterwards.
          examples: [Coto]
        description:
          type: string
          maxLength: 120
          examples: [Compra semanal]
        splits:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TransactionSplit'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    TransactionSummary:
      type: object
      description: |
        Totals of every transaction the filters select, not only of the returned page: the money
        that left (expenses) and the money that came in (incomes), each transaction with its whole
        amount.
      required: [outflowMinor, inflowMinor]
      properties:
        outflowMinor:
          type: integer
          minimum: 0
        inflowMinor:
          type: integer
          minimum: 0
    TransactionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, summary]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
            summary:
              $ref: '#/components/schemas/TransactionSummary'
    AffectedMonths:
      type: object
      description: |
        Months whose derived figures were recalculated by the change, ascending, in the plan's time
        zone: from the earliest month the transaction touched (before or after the change) to the
        later of the current month and the latest month it touched.
      required: [affectedMonths]
      properties:
        affectedMonths:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MonthKey'
    TransactionChange:
      allOf:
        - $ref: '#/components/schemas/AffectedMonths'
        - type: object
          required: [transaction]
          properties:
            transaction:
              $ref: '#/components/schemas/Transaction'
    CreateTransactionSplit:
      type: object
      required: [envelopeId, amountMinor]
      additionalProperties: false
      properties:
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 1
          examples: [15800]
    CreateTransactionRequest:
      type: object
      description: |
        Exclusive fields, enforced with `400`: `payeeId` or `payeeName`; for an expense `envelopeId`
        or `splits` (one of them is required); an income takes no `splits`. The portions of `splits`
        must add up exactly to `amountMinor`.
      required: [direction, accountId, amountMinor, occurredAt]
      additionalProperties: false
      properties:
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        accountId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 1
          examples: [18450]
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        payeeId:
          $ref: '#/components/schemas/Uuid'
        payeeName:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Coto]
        description:
          type: string
          maxLength: 120
          examples: [Compra semanal]
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        splits:
          type: array
          minItems: 2
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreateTransactionSplit'
    Uuid:
      type: string
      format: uuid
      description: UUID v4 identifier.
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 instant with UTC offset, e.g. 2026-09-29T14:30:00Z.
    MonthKey:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      description: Budget month as YYYY-MM.
      examples: ['2026-09']
    CurrencyCode:
      type: string
      description: Currency of a plan. Chosen at plan creation and immutable afterwards (FR-40).
      enum: [ARS, USD, EUR]
    Currency:
      type: object
      description: |
        Currency of a plan, one of exactly three options.
        ARS: symbol `$`, name `pesos`, 0 minor units.
        USD: symbol `US$`, name `dólares`, 2 minor units.
        EUR: symbol `€`, name `euros`, 2 minor units.
        Clients format amounts (es-AR: `.` thousands, `,` decimal, `−` before the symbol for
        negatives); the API never returns pre-formatted money strings.
      required: [code, symbol, name, minorUnits]
      properties:
        code:
          $ref: '#/components/schemas/CurrencyCode'
        symbol:
          type: string
          enum: ['$', 'US$', '€']
        name:
          type: string
          description: Spanish display name shown next to the symbol, e.g. "pesos ($)".
          enum: [pesos, dólares, euros]
        minorUnits:
          type: integer
          description: Decimal digits of the minor unit.
          enum: [0, 2]
      examples:
        - code: USD
          symbol: US$
          name: dólares
          minorUnits: 2
    MoneyMinor:
      type: integer
      description: |
        Integer amount in the minor units of the owning plan's currency, as defined by that
        currency's `minorUnits` (ARS amounts are whole pesos; USD and EUR are cents). Never a
        float. Use in fields named `<thing>Minor`.
      examples: [1250]
    PageMeta:
      type: object
      description: |
        Pagination envelope. A list response is
        `allOf: [PageMeta, { properties: { items: { type: array, items: <resource> } } }]`.
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Count of all matching items across pages.
