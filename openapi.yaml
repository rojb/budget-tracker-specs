openapi: 3.1.0
info:
  title: Budget Tracker API
  version: 0.1.0
  description: |
    Source of truth for the Budget Tracker HTTP API (contract-first). Changes go through a PR
    approved by both developers (docs/COLABORACION.md section 4).

    Conventions (capability `api-conventions`):
    - JSON property names are camelCase.
    - Money is an integer in the minor units of the plan's currency, in fields named
      `<thing>Minor`. The currency (ARS, USD or EUR, immutable per plan) is a property of the plan
      and is never repeated per amount. Formatting is the client's job; the API never returns
      formatted money strings. Responses that must not reveal financial state omit amounts.
    - Identifiers are UUID v4 strings; instants are ISO-8601 date-times with offset; budget months
      are `YYYY-MM` keys.
    - Every operation requires a bearer JWT unless it declares `security: []`.
    - List endpoints paginate with `page` (1-based) and `pageSize` (default 20, max 100) and return
      `{ items, page, pageSize, total }`.
    - Errors use `{ statusCode, message, error }`; validation failures are 400 with `message` as
      an array of strings.
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Service liveness.
  - name: Auth
    description: Account registration and login (public).
  - name: Users
    description: The authenticated user.
  - name: Plans
    description: Budget plans, their currency and members.
  - name: Accounts
    description: Accounts of a plan, with derived balances; archived instead of deleted.
  - name: Payees
    description: Reusable payees of a plan; deleted logically so past transactions keep them.
  - name: Envelopes
    description: Envelope groups and envelopes of a plan, the starter template and the initial bulk assignment (FR-04).
  - name: Transactions
    description: Expenses and income of a plan, with split payments, and the movements list (FR-06, FR-07, FR-08, FR-14).
  - name: Sharing
    description: Invitation codes, joining a plan and managing its members (FR-27).
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account
      description: |
        Creates a user and returns a session. The email is trimmed and lowercased; it must be
        unique. The password is stored only as an Argon2id hash and is never returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: An account with that email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                message: Email already registered
                error: Conflict
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Exchanges credentials for a session. Every credential failure returns the same generic
        401, so the response never reveals whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The credentials are valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Invalid email or password
                error: Unauthorized
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user
      responses:
        '200':
          description: The user the bearer token was issued for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: List my plans
      description: Every plan the caller is a member of, ordered by creation. Bounded collection, not paginated.
      responses:
        '200':
          description: The caller's plans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Plans]
      operationId: createPlan
      summary: Create a plan
      description: |
        Creates a plan with the caller as its only member (`owner`), optionally with its first
        account, atomically. The currency is fixed forever (FR-40).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: The plan was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /plans/{planId}:
    get:
      parameters:
        - $ref: '#/components/parameters/PlanId'
      tags: [Plans]
      operationId: getPlan
      summary: Get a plan
      responses:
        '200':
          description: The plan and its members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      parameters:
        - $ref: '#/components/parameters/PlanId'
      tags: [Plans]
      operationId: updatePlan
      summary: Rename a plan (owner only)
      description: Only the name can change; the currency is immutable, so sending it is a validation error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: The renamed plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      parameters:
        - $ref: '#/components/parameters/PlanId'
      tags: [Plans]
      operationId: deletePlan
      summary: Delete a plan (owner only)
      description: Removes the plan and everything scoped to it.
      responses:
        '204':
          description: The plan was deleted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts
      description: |
        Active accounts ordered by creation, or with `archived=true` the archived ones, most
        recently archived first. Bounded collection, not paginated.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: archived
          in: query
          description: List archived accounts instead of active ones.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      parameters:
        - $ref: '#/components/parameters/PlanId'
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account (owner or editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account with its monthly inflow and outflow
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/AccountId'
        - name: month
          in: query
          description: Month of the inflow/outflow figures; defaults to the current month in the plan's time zone.
          schema:
            $ref: '#/components/schemas/MonthKey'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/AccountId'
      tags: [Accounts]
      operationId: updateAccount
      summary: Edit an account (owner or editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: The edited account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/accounts/{accountId}/archive:
    post:
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/AccountId'
      tags: [Accounts]
      operationId: archiveAccount
      summary: Archive an account (owner or editor)
      description: The account keeps its history but stops counting in the total balance and in new entries. Accounts are never deleted.
      responses:
        '200':
          description: The archived account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plans/{planId}/accounts/{accountId}/restore:
    post:
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/AccountId'
      tags: [Accounts]
      operationId: restoreAccount
      summary: Restore an archived account (owner or editor)
      responses:
        '200':
          description: The restored account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plans/{planId}/payees:
    get:
      tags: [Payees]
      operationId: listPayees
      summary: List and search payees
      description: Active payees ordered by name, optionally filtered by `q` (case-insensitive substring).
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: q
          in: query
          description: Case-insensitive part of the name.
          schema:
            type: string
            maxLength: 60
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of payees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayeePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Payees]
      operationId: createPayee
      summary: Create a payee (owner or editor)
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayeeRequest'
      responses:
        '201':
          description: The payee was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayeeNameTaken'
  /plans/{planId}/payees/{payeeId}:
    get:
      tags: [Payees]
      operationId: getPayee
      summary: Get a payee, including a deleted one
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PayeeId'
      responses:
        '200':
          description: The payee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Payees]
      operationId: updatePayee
      summary: Edit an active payee (owner or editor)
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PayeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePayeeRequest'
      responses:
        '200':
          description: The edited payee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayeeNameTaken'
    delete:
      tags: [Payees]
      operationId: deletePayee
      summary: Delete a payee logically (owner or editor)
      description: The payee stops being listed and offered, but past transactions keep it (FR-05).
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PayeeId'
      responses:
        '204':
          description: The payee was deleted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /envelope-template:
    get:
      tags: [Envelopes]
      operationId: getEnvelopeTemplate
      summary: Get the suggested starter template
      description: The same four groups and twelve envelopes for every plan, in order, each envelope with its icon.
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /plans/{planId}/envelope-groups:
    get:
      tags: [Envelopes]
      operationId: listEnvelopeGroups
      summary: List the envelope groups
      description: Groups in order, each with its number of envelopes.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: The groups of the plan.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvelopeGroup'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Envelopes]
      operationId: createEnvelopeGroup
      summary: Create an envelope group (owner or editor)
      description: The group is placed after the existing ones.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvelopeGroupRequest'
      responses:
        '201':
          description: The group was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGroup'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EnvelopeGroupNameTaken'
  /plans/{planId}/envelope-groups/order:
    put:
      tags: [Envelopes]
      operationId: reorderEnvelopeGroups
      summary: Set the order of the groups (owner or editor)
      description: "`groupIds` must list every group of the plan exactly once."
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderEnvelopeGroupsRequest'
      responses:
        '200':
          description: The groups in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvelopeGroup'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/envelope-groups/template:
    post:
      tags: [Envelopes]
      operationId: applyEnvelopeTemplate
      summary: Create the starter template envelopes (owner or editor)
      description: Creates the selected template envelopes, without assigned amount, in one atomic operation. Only allowed in a plan with no envelopes.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyEnvelopeTemplateRequest'
      responses:
        '201':
          description: The groups and envelopes of the plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTemplateResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PlanHasEnvelopes'
  /plans/{planId}/envelope-groups/{groupId}:
    patch:
      tags: [Envelopes]
      operationId: updateEnvelopeGroup
      summary: Rename an envelope group (owner or editor)
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvelopeGroupRequest'
      responses:
        '200':
          description: The renamed group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGroup'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EnvelopeGroupNameTaken'
    delete:
      tags: [Envelopes]
      operationId: deleteEnvelopeGroup
      summary: Delete an envelope group (owner or editor)
      description: Its envelopes are kept, without a group; no money or transaction is lost.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: The group was deleted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/envelopes:
    get:
      tags: [Envelopes]
      operationId: listEnvelopes
      summary: List the envelopes with the figures of a month
      description: Envelopes ordered by group and position, those without a group last, with the assigned and available amounts the budget engine derives for the month and the month Ready to Assign.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: The envelopes and the month's Ready to Assign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Envelopes]
      operationId: createEnvelope
      summary: Create an envelope (owner or editor)
      description: Placed last in its group, or last among the envelopes without a group.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvelopeRequest'
      responses:
        '201':
          description: The envelope was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EnvelopeNameTaken'
  /plans/{planId}/envelopes/order:
    put:
      tags: [Envelopes]
      operationId: reorderEnvelopes
      summary: Set the order of the envelopes of a group (owner or editor)
      description: "`envelopeIds` must list every envelope of that group (or of the envelopes without a group when `groupId` is absent) exactly once."
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderEnvelopesRequest'
      responses:
        '200':
          description: The envelopes in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/envelopes/initial-assignment:
    post:
      tags: [Envelopes]
      operationId: applyInitialAssignment
      summary: Assign money to several envelopes at once (owner or editor)
      description: Stores each amount as the envelope's assignment for the month, replacing the previous one, in one atomic operation. The resulting Ready to Assign can be negative.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialAssignmentRequest'
      responses:
        '200':
          description: The month, the total assigned and the Ready to Assign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialAssignmentResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/envelopes/{envelopeId}:
    get:
      tags: [Envelopes]
      operationId: getEnvelope
      summary: Get an envelope
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: The envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Envelopes]
      operationId: updateEnvelope
      summary: Edit or move an envelope (owner or editor)
      description: Moving it to another group places it last there.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvelopeRequest'
      responses:
        '200':
          description: The edited envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EnvelopeNameTaken'
    delete:
      tags: [Envelopes]
      operationId: deleteEnvelope
      summary: Delete an envelope (owner or editor)
      description: Its assignments are deleted with it, so its money returns to Ready to Assign. Transactions are kept without an envelope; payees that suggested it lose the suggestion.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '204':
          description: The envelope was deleted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/invitation:
    get:
      tags: [Sharing]
      operationId: getInvitation
      summary: Get the plan's active invitation (owner only)
      description: 404 when there is no active code (none, expired, used or revoked).
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: The active invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Sharing]
      operationId: createInvitation
      summary: Generate an invitation code (owner only)
      description: Single use, valid 24 hours. Replaces the plan's previous active code.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: The new invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sharing]
      operationId: revokeInvitation
      summary: Revoke the active invitation (owner only)
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '204':
          description: The code no longer works.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/members/{userId}:
    patch:
      tags: [Sharing]
      operationId: updateMember
      summary: Change a member's role (owner only)
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanMember'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OwnerMembership'
    delete:
      tags: [Sharing]
      operationId: removeMember
      summary: Remove a member (owner) or leave the plan (the member themself)
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: The membership was removed.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OwnerMembership'
  /invitations/{code}:
    get:
      tags: [Sharing]
      operationId: previewInvitation
      summary: Preview the plan behind a code
      description: Never reveals amounts or member emails. 404 for unknown, expired, used or revoked codes.
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      responses:
        '200':
          description: What joining would give.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /invitations/{code}/accept:
    post:
      tags: [Sharing]
      operationId: acceptInvitation
      summary: Join the plan with a code
      description: Uses the code (single use) and adds the caller with the invitation's role.
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      responses:
        '200':
          description: The joined plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The caller is already a member, or the plan already has 5 members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                message: You are already a member of this plan
                error: Conflict
  /plans/{planId}/transfers:
    get:
      tags: [Accounts]
      operationId: listTransfers
      summary: List transfers between accounts
      description: Newest first; with `accountId`, only transfers that leave or enter that account.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: accountId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of transfers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Accounts]
      operationId: createTransfer
      summary: Move money between two accounts (owner or editor)
      description: No envelope and no payee; only the two balances change (FR-28).
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: The transfer was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: One of the accounts is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                message: Account is archived
                error: Conflict
  /plans/{planId}/transfers/{transferId}:
    delete:
      tags: [Accounts]
      operationId: deleteTransfer
      summary: Delete a transfer (owner or editor)
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/TransferId'
      responses:
        '204':
          description: The transfer was deleted and both balances restored.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions (movements)
      description: |
        Newest first by `occurredAt` (ties by creation instant); with `accountId`, only the
        transactions recorded on that account. Transfers between accounts are not transactions and
        are not listed here.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: accountId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Record an expense or an income (owner or editor)
      description: |
        An expense names its envelope with `envelopeId` or is divided with `splits` (at least two
        portions that add up exactly to `amountMinor`). An income may name an `envelopeId`; without
        one it goes to Ready to Assign. The payee is optional: `payeeId` of an active payee or
        `payeeName`, which reuses the active payee with that name or creates it.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: The transaction was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The account is archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                message: Account is archived
                error: Conflict
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvitationCode:
      name: code
      in: path
      required: true
      description: Invitation code, with or without the dash, any letter case.
      schema:
        type: string
        pattern: '^[A-Za-z0-9]{3}-?[A-Za-z0-9]{3}$'
        examples: [K7M-4QX]
    PayeeId:
      name: payeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EnvelopeId:
      name: envelopeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Month:
      name: month
      in: query
      description: Budget month as YYYY-MM; the current month in the plan's time zone when absent.
      schema:
        $ref: '#/components/schemas/MonthKey'
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 401
            message: Unauthorized
            error: Unauthorized
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            message: Resource not found
            error: Not Found
    Forbidden:
      description: The caller's role in the plan does not allow this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 403
            message: Your role in this plan does not allow this action
            error: Forbidden
    Conflict:
      description: The resource is already in the requested state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Account is already archived
            error: Conflict
    OwnerMembership:
      description: The plan owner's membership cannot be changed or removed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: The owner's membership cannot be changed
            error: Conflict
    PayeeNameTaken:
      description: Another active payee of the plan already has that name (case-insensitive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Payee name already in use
            error: Conflict
    EnvelopeGroupNameTaken:
      description: Another group of the plan already has that name (case-insensitive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Envelope group name already in use
            error: Conflict
    EnvelopeNameTaken:
      description: Another envelope of the plan already has that name (case-insensitive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Envelope name already in use
            error: Conflict
    PlanHasEnvelopes:
      description: The template can only be applied to a plan that has no envelopes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: The plan already has envelopes
            error: Conflict
    ValidationFailed:
      description: The request failed validation; `message` lists one entry per violated constraint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            statusCode: 400
            message:
              - amountMinor must be an integer number
            error: Bad Request
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          description: Equal to the HTTP status.
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          description: Short HTTP reason phrase.
    ValidationError:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          enum: [400]
        message:
          type: array
          items:
            type: string
        error:
          type: string
          enum: [Bad Request]
    RegisterRequest:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: [Sofía Martínez]
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored lowercase; unique across accounts.
          examples: [sofia@correo.com]
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [sofia@correo.com]
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
    User:
      type: object
      description: A person with an account. Never carries credentials.
      required: [id, name, email, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AuthSession:
      type: object
      description: A signed JWT access token (default expiry 7 days, no refresh token) and its user.
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: 'Sent as `Authorization: Bearer <accessToken>`.'
        user:
          $ref: '#/components/schemas/User'
    PlanRole:
      type: string
      description: |
        Role of a member in a plan. `owner` manages the plan (rename, delete, and in later changes
        invitations); `editor` changes the plan's data; `viewer` only reads.
      enum: [owner, editor, viewer]
    PlanMember:
      type: object
      required: [userId, name, email, role, joinedAt]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/PlanRole'
        joinedAt:
          $ref: '#/components/schemas/Timestamp'
    Plan:
      type: object
      description: A budget plan. Never carries amounts.
      required: [id, name, currency, timeZone, myRole, members, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Mi plan]
        currency:
          $ref: '#/components/schemas/Currency'
        timeZone:
          type: string
          description: IANA time zone used to attribute transactions to budget months.
          examples: [America/Argentina/Buenos_Aires]
        myRole:
          $ref: '#/components/schemas/PlanRole'
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlanMember'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CreatePlanRequest:
      type: object
      required: [name, currencyCode]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Mi plan]
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          maxLength: 64
          description: IANA time zone; defaults to America/Argentina/Buenos_Aires.
        firstAccount:
          $ref: '#/components/schemas/CreateAccountRequest'
    UpdatePlanRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    AccountType:
      type: string
      description: 'Kind of account: bank (Banco), digitalWallet (Billetera virtual), cash (Efectivo).'
      enum: [bank, digitalWallet, cash]
    Account:
      type: object
      description: An account of a plan. `balanceMinor` is derived on every read, never stored.
      required: [id, name, type, openingBalanceMinor, balanceMinor, archived, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Banco Nación]
        type:
          $ref: '#/components/schemas/AccountType'
        openingBalanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
        balanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
        archived:
          type: boolean
        archivedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the account was archived; present only while `archived` is true.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AccountDetail:
      description: An account plus the money that entered and left it in one month.
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          required: [month, inflowMinor, outflowMinor]
          properties:
            month:
              $ref: '#/components/schemas/MonthKey'
            inflowMinor:
              $ref: '#/components/schemas/MoneyMinor'
            outflowMinor:
              $ref: '#/components/schemas/MoneyMinor'
    CreateAccountRequest:
      type: object
      required: [name, type, openingBalanceMinor]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Mercado Pago]
        type:
          $ref: '#/components/schemas/AccountType'
        openingBalanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        type:
          $ref: '#/components/schemas/AccountType'
        openingBalanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
    Payee:
      type: object
      description: A payee of a plan. A deleted payee is still readable so past transactions can show it.
      required: [id, name, transactionCount, deleted, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Coto]
        suggestedEnvelopeId:
          $ref: '#/components/schemas/Uuid'
          description: Envelope proposed when this payee is chosen; absent when there is none.
        transactionCount:
          type: integer
          minimum: 0
          description: Transactions that reference this payee.
        deleted:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PayeePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Payee'
    CreatePayeeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Coto]
        suggestedEnvelopeId:
          $ref: '#/components/schemas/Uuid'
    UpdatePayeeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        suggestedEnvelopeId:
          $ref: '#/components/schemas/Uuid'
    InvitationRole:
      type: string
      description: Role an invitation grants, or a member can be given (the owner role is not transferable).
      enum: [editor, viewer]
    Invitation:
      type: object
      required: [code, role, expiresAt, createdAt, link]
      properties:
        code:
          type: string
          description: Shown as XXX-XXX.
          examples: [K7M-4QX]
        role:
          $ref: '#/components/schemas/InvitationRole'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        link:
          type: string
          format: uri
          description: Link encoded in the QR; opens the join screen with the code loaded.
          examples: ['https://sobres.app/unirse/K7M4QX']
    CreateInvitationRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/InvitationRole'
    InvitationPreview:
      type: object
      description: What a code gives access to. Never carries amounts or member emails.
      required: [planName, ownerName, currency, role, expiresAt]
      properties:
        planName:
          type: string
          examples: [Casa con Juli]
        ownerName:
          type: string
          examples: [Sofía Martínez]
        currency:
          $ref: '#/components/schemas/Currency'
        role:
          $ref: '#/components/schemas/InvitationRole'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    UpdateMemberRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/InvitationRole'
    Transfer:
      type: object
      description: Money moved between two accounts of the same plan. Never touches envelopes.
      required: [id, fromAccountId, toAccountId, amountMinor, occurredAt, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        fromAccountId:
          $ref: '#/components/schemas/Uuid'
        toAccountId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 1
          description: Positive amount in the plan currency's minor units.
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    TransferPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Transfer'
    CreateTransferRequest:
      type: object
      required: [fromAccountId, toAccountId, amountMinor, occurredAt]
      additionalProperties: false
      properties:
        fromAccountId:
          $ref: '#/components/schemas/Uuid'
        toAccountId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 1
          examples: [20000]
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
    EnvelopeIcon:
      type: string
      description: Closed set of icon names an envelope can carry; the client maps each to a glyph.
      enum: [tag, home, bus, utensils, heartPulse, gift, cart, pill, wifi, settings, ticket, repeat, lifeBuoy, plane]
    EnvelopeGroup:
      type: object
      description: An ordered group of envelopes of a plan.
      required: [id, name, position, envelopeCount, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Día a día]
        position:
          type: integer
          minimum: 0
          description: Zero-based place of the group in the plan.
        envelopeCount:
          type: integer
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CreateEnvelopeGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Hogar]
    UpdateEnvelopeGroupRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    ReorderEnvelopeGroupsRequest:
      type: object
      required: [groupIds]
      additionalProperties: false
      properties:
        groupIds:
          type: array
          description: Every group of the plan exactly once, in the desired order.
          items:
            $ref: '#/components/schemas/Uuid'
    Envelope:
      type: object
      description: An envelope of a plan. `groupId` is absent when it has no group ("Sin grupo").
      required: [id, name, icon, position, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Supermercado]
        icon:
          $ref: '#/components/schemas/EnvelopeIcon'
        groupId:
          $ref: '#/components/schemas/Uuid'
        position:
          type: integer
          minimum: 0
          description: Zero-based place inside its group (or among the envelopes without a group).
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    EnvelopeLine:
      type: object
      description: An envelope with the figures the budget engine derives for a month.
      required: [envelope, assignedMinor, spentMinor, availableMinor]
      properties:
        envelope:
          $ref: '#/components/schemas/Envelope'
        assignedMinor:
          $ref: '#/components/schemas/MoneyMinor'
        spentMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Net outflow of the month (expenses minus income sent to the envelope); negative when income exceeds expenses.
        availableMinor:
          $ref: '#/components/schemas/MoneyMinor'
    EnvelopeList:
      type: object
      required: [month, readyToAssignMinor, items]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        readyToAssignMinor:
          $ref: '#/components/schemas/MoneyMinor'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeLine'
    CreateEnvelopeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Suscripciones]
        groupId:
          $ref: '#/components/schemas/Uuid'
        icon:
          $ref: '#/components/schemas/EnvelopeIcon'
    UpdateEnvelopeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        groupId:
          $ref: '#/components/schemas/Uuid'
        icon:
          $ref: '#/components/schemas/EnvelopeIcon'
    ReorderEnvelopesRequest:
      type: object
      required: [envelopeIds]
      additionalProperties: false
      properties:
        groupId:
          $ref: '#/components/schemas/Uuid'
          description: The group whose envelopes are ordered; absent for the envelopes without a group.
        envelopeIds:
          type: array
          description: Every envelope of that scope exactly once, in the desired order.
          items:
            $ref: '#/components/schemas/Uuid'
    TemplateEnvelope:
      type: object
      required: [name, icon]
      properties:
        name:
          type: string
          examples: [Alquiler]
        icon:
          $ref: '#/components/schemas/EnvelopeIcon'
    TemplateGroup:
      type: object
      required: [name, envelopes]
      properties:
        name:
          type: string
          examples: [Obligaciones]
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/TemplateEnvelope'
    EnvelopeTemplate:
      type: object
      description: The suggested starter template, the same for every plan (4 groups, 12 envelopes).
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TemplateGroup'
    ApplyEnvelopeTemplateRequest:
      type: object
      additionalProperties: false
      properties:
        envelopeNames:
          type: array
          description: Names of the template envelopes to create; all of them when absent.
          items:
            type: string
    EnvelopeTemplateResult:
      type: object
      required: [groups, envelopes]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeGroup'
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/Envelope'
    InitialAssignment:
      type: object
      required: [envelopeId, amountMinor]
      additionalProperties: false
      properties:
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 0
          examples: [280000]
    InitialAssignmentRequest:
      type: object
      required: [assignments]
      additionalProperties: false
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        assignments:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/InitialAssignment'
    InitialAssignmentResult:
      type: object
      required: [month, assignedMinor, readyToAssignMinor]
      properties:
        month:
          $ref: '#/components/schemas/MonthKey'
        assignedMinor:
          $ref: '#/components/schemas/MoneyMinor'
        readyToAssignMinor:
          $ref: '#/components/schemas/MoneyMinor'
          description: Ready to Assign of the month after the assignment; negative when over-assigned.
    TransactionDirection:
      type: string
      description: '`expense` moves money out of the account, `income` moves money in.'
      enum: [expense, income]
    TransactionSplit:
      type: object
      description: |
        One portion of a transaction. `envelopeId` is absent for an income sent to Ready to Assign
        and for a portion whose envelope was deleted ("Sin sobre").
      required: [amountMinor]
      properties:
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        envelopeName:
          type: string
          examples: [Supermercado]
        amountMinor:
          type: integer
          minimum: 1
    Transaction:
      type: object
      description: An expense or income of a plan. Its portions always add up to `amountMinor`.
      required: [id, direction, accountId, accountName, amountMinor, occurredAt, splits, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        accountId:
          $ref: '#/components/schemas/Uuid'
        accountName:
          type: string
          examples: [Banco Nación]
        amountMinor:
          type: integer
          minimum: 1
          description: Positive amount in the plan currency's minor units.
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        payeeId:
          $ref: '#/components/schemas/Uuid'
        payeeName:
          type: string
          description: Name of the payee, also when it was deleted afterwards.
          examples: [Coto]
        description:
          type: string
          maxLength: 120
          examples: [Compra semanal]
        splits:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TransactionSplit'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    TransactionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
    CreateTransactionSplit:
      type: object
      required: [envelopeId, amountMinor]
      additionalProperties: false
      properties:
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 1
          examples: [15800]
    CreateTransactionRequest:
      type: object
      description: |
        Exclusive fields, enforced with `400`: `payeeId` or `payeeName`; for an expense `envelopeId`
        or `splits` (one of them is required); an income takes no `splits`. The portions of `splits`
        must add up exactly to `amountMinor`.
      required: [direction, accountId, amountMinor, occurredAt]
      additionalProperties: false
      properties:
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        accountId:
          $ref: '#/components/schemas/Uuid'
        amountMinor:
          type: integer
          minimum: 1
          examples: [18450]
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        payeeId:
          $ref: '#/components/schemas/Uuid'
        payeeName:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Coto]
        description:
          type: string
          maxLength: 120
          examples: [Compra semanal]
        envelopeId:
          $ref: '#/components/schemas/Uuid'
        splits:
          type: array
          minItems: 2
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreateTransactionSplit'
    Uuid:
      type: string
      format: uuid
      description: UUID v4 identifier.
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 instant with UTC offset, e.g. 2026-09-29T14:30:00Z.
    MonthKey:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      description: Budget month as YYYY-MM.
      examples: ['2026-09']
    CurrencyCode:
      type: string
      description: Currency of a plan. Chosen at plan creation and immutable afterwards (FR-40).
      enum: [ARS, USD, EUR]
    Currency:
      type: object
      description: |
        Currency of a plan, one of exactly three options.
        ARS: symbol `$`, name `pesos`, 0 minor units.
        USD: symbol `US$`, name `dólares`, 2 minor units.
        EUR: symbol `€`, name `euros`, 2 minor units.
        Clients format amounts (es-AR: `.` thousands, `,` decimal, `−` before the symbol for
        negatives); the API never returns pre-formatted money strings.
      required: [code, symbol, name, minorUnits]
      properties:
        code:
          $ref: '#/components/schemas/CurrencyCode'
        symbol:
          type: string
          enum: ['$', 'US$', '€']
        name:
          type: string
          description: Spanish display name shown next to the symbol, e.g. "pesos ($)".
          enum: [pesos, dólares, euros]
        minorUnits:
          type: integer
          description: Decimal digits of the minor unit.
          enum: [0, 2]
      examples:
        - code: USD
          symbol: US$
          name: dólares
          minorUnits: 2
    MoneyMinor:
      type: integer
      description: |
        Integer amount in the minor units of the owning plan's currency, as defined by that
        currency's `minorUnits` (ARS amounts are whole pesos; USD and EUR are cents). Never a
        float. Use in fields named `<thing>Minor`.
      examples: [1250]
    PageMeta:
      type: object
      description: |
        Pagination envelope. A list response is
        `allOf: [PageMeta, { properties: { items: { type: array, items: <resource> } } }]`.
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Count of all matching items across pages.
