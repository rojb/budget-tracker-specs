        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Envelopes]
      operationId: updateEnvelope
      summary: Edit or move an envelope (owner or editor)
      description: Moving it to another group places it last there.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvelopeRequest'
      responses:
        '200':
          description: The edited envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EnvelopeNameTaken'
    delete:
      tags: [Envelopes]
      operationId: deleteEnvelope
      summary: Delete an envelope (owner or editor)
      description: Its assignments are deleted with it, so its money returns to Ready to Assign. Transactions are kept without an envelope; payees that suggested it lose the suggestion. Its goal and its photo file are deleted too.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '204':
          description: The envelope was deleted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/envelopes/{envelopeId}/goal:
    put:
      tags: [Envelopes]
      operationId: setEnvelopeGoal
      summary: Set or replace the goal of an envelope (owner or editor)
