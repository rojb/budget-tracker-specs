  /plans/{planId}/envelopes/{envelopeId}/photo:
    get:
      tags: [Envelopes]
      operationId: getEnvelopePhoto
      summary: Get the photo of an envelope (any member)
      description: Served only with a valid bearer token to a member of the plan; `404` for a non-member and for an envelope without a photo.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: The photo, a JPEG resized to at most 1080 pixels wide.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Envelopes]
      operationId: uploadEnvelopePhoto
      summary: Set or replace the photo of an envelope (owner or editor)
      description: |
        A JPEG, PNG or WebP image of at most 5 MB in the multipart field `file`. The type is decided
        by the content of the file, not by its name or declared type. The server resizes it to at
        most 1080 pixels wide, strips its metadata and stores it as JPEG; the previous photo file is
        deleted.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/EnvelopeId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The image (JPEG, PNG or WebP, at most 5 MB).
      responses:
        '200':
          description: The envelope with its new `photoUrl`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      tags: [Envelopes]
      operationId: deleteEnvelopePhoto
      summary: Remove the photo of an envelope (owner or editor)
      description: Deletes the stored file; responds `200` also when the envelope had no photo.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/EnvelopeId'
      responses:
        '200':
          description: The envelope without `photoUrl`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/envelopes/{envelopeId}/photo/suggested:
    post:
      tags: [Envelopes]
      operationId: applySuggestedEnvelopePhoto
