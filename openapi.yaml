openapi: 3.1.0
info:
  title: Budget Tracker API
  version: 0.1.0
  description: |
    Source of truth for the Budget Tracker HTTP API (contract-first). Changes go through a PR
    approved by both developers (docs/COLABORACION.md section 4).

    Conventions (capability `api-conventions`):
    - JSON property names are camelCase.
    - Money is an integer in the minor units of the plan's currency, in fields named
      `<thing>Minor`. The currency (ARS, USD or EUR, immutable per plan) is a property of the plan
      and is never repeated per amount. Formatting is the client's job; the API never returns
      formatted money strings. Responses that must not reveal financial state omit amounts.
    - Identifiers are UUID v4 strings; instants are ISO-8601 date-times with offset; budget months
      are `YYYY-MM` keys.
    - Every operation requires a bearer JWT unless it declares `security: []`.
    - List endpoints paginate with `page` (1-based) and `pageSize` (default 20, max 100) and return
      `{ items, page, pageSize, total }`.
    - Errors use `{ statusCode, message, error }`; validation failures are 400 with `message` as
      an array of strings.
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Service liveness.
  - name: Auth
    description: Account registration and login (public).
  - name: Users
    description: The authenticated user.
  - name: Plans
    description: Budget plans, their currency and members.
  - name: Accounts
    description: Accounts of a plan, with derived balances; archived instead of deleted.
  - name: Payees
    description: Reusable payees of a plan; deleted logically so past transactions keep them.
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account
      description: |
        Creates a user and returns a session. The email is trimmed and lowercased; it must be
        unique. The password is stored only as an Argon2id hash and is never returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: An account with that email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                message: Email already registered
                error: Conflict
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Exchanges credentials for a session. Every credential failure returns the same generic
        401, so the response never reveals whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The credentials are valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Invalid email or password
                error: Unauthorized
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user
      responses:
        '200':
          description: The user the bearer token was issued for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: List my plans
      description: Every plan the caller is a member of, ordered by creation. Bounded collection, not paginated.
      responses:
        '200':
          description: The caller's plans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Plans]
      operationId: createPlan
      summary: Create a plan
      description: |
        Creates a plan with the caller as its only member (`owner`), optionally with its first
        account, atomically. The currency is fixed forever (FR-40).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: The plan was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /plans/{planId}:
    get:
      parameters:
        - $ref: '#/components/parameters/PlanId'
      tags: [Plans]
      operationId: getPlan
      summary: Get a plan
      responses:
        '200':
          description: The plan and its members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      parameters:
        - $ref: '#/components/parameters/PlanId'
      tags: [Plans]
      operationId: updatePlan
      summary: Rename a plan (owner only)
      description: Only the name can change; the currency is immutable, so sending it is a validation error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: The renamed plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      parameters:
        - $ref: '#/components/parameters/PlanId'
      tags: [Plans]
      operationId: deletePlan
      summary: Delete a plan (owner only)
      description: Removes the plan and everything scoped to it.
      responses:
        '204':
          description: The plan was deleted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts
      description: |
        Active accounts ordered by creation, or with `archived=true` the archived ones, most
        recently archived first. Bounded collection, not paginated.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: archived
          in: query
          description: List archived accounts instead of active ones.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      parameters:
        - $ref: '#/components/parameters/PlanId'
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account (owner or editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get an account with its monthly inflow and outflow
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/AccountId'
        - name: month
          in: query
          description: Month of the inflow/outflow figures; defaults to the current month in the plan's time zone.
          schema:
            $ref: '#/components/schemas/MonthKey'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/AccountId'
      tags: [Accounts]
      operationId: updateAccount
      summary: Edit an account (owner or editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: The edited account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plans/{planId}/accounts/{accountId}/archive:
    post:
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/AccountId'
      tags: [Accounts]
      operationId: archiveAccount
      summary: Archive an account (owner or editor)
      description: The account keeps its history but stops counting in the total balance and in new entries. Accounts are never deleted.
      responses:
        '200':
          description: The archived account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plans/{planId}/accounts/{accountId}/restore:
    post:
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/AccountId'
      tags: [Accounts]
      operationId: restoreAccount
      summary: Restore an archived account (owner or editor)
      responses:
        '200':
          description: The restored account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /plans/{planId}/payees:
    get:
      tags: [Payees]
      operationId: listPayees
      summary: List and search payees
      description: Active payees ordered by name, optionally filtered by `q` (case-insensitive substring).
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: q
          in: query
          description: Case-insensitive part of the name.
          schema:
            type: string
            maxLength: 60
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of payees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayeePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Payees]
      operationId: createPayee
      summary: Create a payee (owner or editor)
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayeeRequest'
      responses:
        '201':
          description: The payee was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayeeNameTaken'
  /plans/{planId}/payees/{payeeId}:
    get:
      tags: [Payees]
      operationId: getPayee
      summary: Get a payee, including a deleted one
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PayeeId'
      responses:
        '200':
          description: The payee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Payees]
      operationId: updatePayee
      summary: Edit an active payee (owner or editor)
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PayeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePayeeRequest'
      responses:
        '200':
          description: The edited payee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payee'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PayeeNameTaken'
    delete:
      tags: [Payees]
      operationId: deletePayee
      summary: Delete a payee logically (owner or editor)
      description: The payee stops being listed and offered, but past transactions keep it (FR-05).
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PayeeId'
      responses:
        '204':
          description: The payee was deleted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PayeeId:
      name: payeeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 401
            message: Unauthorized
            error: Unauthorized
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            message: Resource not found
            error: Not Found
    Forbidden:
      description: The caller's role in the plan does not allow this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 403
            message: Your role in this plan does not allow this action
            error: Forbidden
    Conflict:
      description: The resource is already in the requested state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Account is already archived
            error: Conflict
    PayeeNameTaken:
      description: Another active payee of the plan already has that name (case-insensitive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 409
            message: Payee name already in use
            error: Conflict
    ValidationFailed:
      description: The request failed validation; `message` lists one entry per violated constraint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            statusCode: 400
            message:
              - amountMinor must be an integer number
            error: Bad Request
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          description: Equal to the HTTP status.
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          description: Short HTTP reason phrase.
    ValidationError:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          enum: [400]
        message:
          type: array
          items:
            type: string
        error:
          type: string
          enum: [Bad Request]
    RegisterRequest:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: [Sofía Martínez]
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored lowercase; unique across accounts.
          examples: [sofia@correo.com]
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [sofia@correo.com]
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
    User:
      type: object
      description: A person with an account. Never carries credentials.
      required: [id, name, email, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AuthSession:
      type: object
      description: A signed JWT access token (default expiry 7 days, no refresh token) and its user.
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: 'Sent as `Authorization: Bearer <accessToken>`.'
        user:
          $ref: '#/components/schemas/User'
    PlanRole:
      type: string
      description: |
        Role of a member in a plan. `owner` manages the plan (rename, delete, and in later changes
        invitations); `editor` changes the plan's data; `viewer` only reads.
      enum: [owner, editor, viewer]
    PlanMember:
      type: object
      required: [userId, name, email, role, joinedAt]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/PlanRole'
        joinedAt:
          $ref: '#/components/schemas/Timestamp'
    Plan:
      type: object
      description: A budget plan. Never carries amounts.
      required: [id, name, currency, timeZone, myRole, members, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Mi plan]
        currency:
          $ref: '#/components/schemas/Currency'
        timeZone:
          type: string
          description: IANA time zone used to attribute transactions to budget months.
          examples: [America/Argentina/Buenos_Aires]
        myRole:
          $ref: '#/components/schemas/PlanRole'
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlanMember'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CreatePlanRequest:
      type: object
      required: [name, currencyCode]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Mi plan]
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          maxLength: 64
          description: IANA time zone; defaults to America/Argentina/Buenos_Aires.
        firstAccount:
          $ref: '#/components/schemas/CreateAccountRequest'
    UpdatePlanRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
    AccountType:
      type: string
      description: 'Kind of account: bank (Banco), digitalWallet (Billetera virtual), cash (Efectivo).'
      enum: [bank, digitalWallet, cash]
    Account:
      type: object
      description: An account of a plan. `balanceMinor` is derived on every read, never stored.
      required: [id, name, type, openingBalanceMinor, balanceMinor, archived, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Banco Nación]
        type:
          $ref: '#/components/schemas/AccountType'
        openingBalanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
        balanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
        archived:
          type: boolean
        archivedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the account was archived; present only while `archived` is true.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AccountDetail:
      description: An account plus the money that entered and left it in one month.
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          required: [month, inflowMinor, outflowMinor]
          properties:
            month:
              $ref: '#/components/schemas/MonthKey'
            inflowMinor:
              $ref: '#/components/schemas/MoneyMinor'
            outflowMinor:
              $ref: '#/components/schemas/MoneyMinor'
    CreateAccountRequest:
      type: object
      required: [name, type, openingBalanceMinor]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Mercado Pago]
        type:
          $ref: '#/components/schemas/AccountType'
        openingBalanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        type:
          $ref: '#/components/schemas/AccountType'
        openingBalanceMinor:
          $ref: '#/components/schemas/MoneyMinor'
    Payee:
      type: object
      description: A payee of a plan. A deleted payee is still readable so past transactions can show it.
      required: [id, name, transactionCount, deleted, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          examples: [Coto]
        suggestedEnvelopeId:
          $ref: '#/components/schemas/Uuid'
          description: Envelope proposed when this payee is chosen; absent when there is none.
        transactionCount:
          type: integer
          minimum: 0
          description: Transactions that reference this payee.
        deleted:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PayeePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Payee'
    CreatePayeeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: [Coto]
        suggestedEnvelopeId:
          $ref: '#/components/schemas/Uuid'
    UpdatePayeeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        suggestedEnvelopeId:
          $ref: '#/components/schemas/Uuid'
    Uuid:
      type: string
      format: uuid
      description: UUID v4 identifier.
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 instant with UTC offset, e.g. 2026-09-29T14:30:00Z.
    MonthKey:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      description: Budget month as YYYY-MM.
      examples: ['2026-09']
    CurrencyCode:
      type: string
      description: Currency of a plan. Chosen at plan creation and immutable afterwards (FR-40).
      enum: [ARS, USD, EUR]
    Currency:
      type: object
      description: |
        Currency of a plan, one of exactly three options.
        ARS: symbol `$`, name `pesos`, 0 minor units.
        USD: symbol `US$`, name `dólares`, 2 minor units.
        EUR: symbol `€`, name `euros`, 2 minor units.
        Clients format amounts (es-AR: `.` thousands, `,` decimal, `−` before the symbol for
        negatives); the API never returns pre-formatted money strings.
      required: [code, symbol, name, minorUnits]
      properties:
        code:
          $ref: '#/components/schemas/CurrencyCode'
        symbol:
          type: string
          enum: ['$', 'US$', '€']
        name:
          type: string
          description: Spanish display name shown next to the symbol, e.g. "pesos ($)".
          enum: [pesos, dólares, euros]
        minorUnits:
          type: integer
          description: Decimal digits of the minor unit.
          enum: [0, 2]
      examples:
        - code: USD
          symbol: US$
          name: dólares
          minorUnits: 2
    MoneyMinor:
      type: integer
      description: |
        Integer amount in the minor units of the owning plan's currency, as defined by that
        currency's `minorUnits` (ARS amounts are whole pesos; USD and EUR are cents). Never a
        float. Use in fields named `<thing>Minor`.
      examples: [1250]
    PageMeta:
      type: object
      description: |
        Pagination envelope. A list response is
        `allOf: [PageMeta, { properties: { items: { type: array, items: <resource> } } }]`.
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Count of all matching items across pages.
